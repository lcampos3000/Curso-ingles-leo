<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curso Pessoal de Inglês — Sistema Léo</title>
<style>
:root{--bg:#101217;--panel:#191d25;--panel2:#222733;--text:#f3f5f7;--muted:#aab2c0;--accent:#b955ed;--accent2:#45d5c0;--warn:#ffd166;--danger:#ff6b7a;--line:#303746}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#101217,#151223 55%,#10201f);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;color:white;background:var(--accent);font-weight:700}button.secondary{background:var(--panel2);border:1px solid var(--line)}button.green{background:#167f70}button.danger{background:#702a38}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.brand h1{font-size:25px;margin:0}.brand p{margin:3px 0;color:var(--muted)}.badge{background:#35213e;color:#e8baff;border:1px solid #713b88;border-radius:99px;padding:5px 10px;font-size:12px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav button{background:transparent;border:1px solid var(--line);color:var(--muted)}.nav button.active{background:var(--accent);color:white;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:rgba(25,29,37,.94);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 8px 25px #0002}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.kpi{font-size:30px;font-weight:800}.muted{color:var(--muted)}h2,h3{margin-top:0}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}input,textarea,select{width:100%;background:#11151c;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}textarea{min-height:150px;resize:vertical}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.pill{display:inline-block;border-radius:99px;padding:4px 9px;background:#253239;color:#9ef0e5;font-size:12px;margin:2px}.progress{height:9px;background:#0d1015;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.lesson{border-left:4px solid var(--accent2);padding-left:13px}.step{padding:11px;border:1px solid var(--line);border-radius:10px;margin:7px 0;background:#161a21}.step b{color:#e7b4ff}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;background:#29313b;padding:12px 15px;border-radius:10px;display:none}.small{font-size:12px}.warning{border-color:#7d6427;background:#302a17}.dangerText{color:var(--danger)}.ok{color:var(--accent2)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}@media(max-width:760px){.wrap{padding:14px}.span8,.span6,.span4{grid-column:span 12}.top{align-items:flex-start;flex-direction:column}.kpi{font-size:25px}}
</style><style>.activityHero{display:flex;gap:14px;align-items:center;padding:15px;border:1px solid #3b3150;border-radius:13px;background:radial-gradient(circle at 10% 20%,#4b2260 0,#211c2c 38%,#151a21 100%);margin:10px 0 16px}.activityIcon{width:64px;height:64px;display:grid;place-items:center;font-size:34px;border-radius:16px;background:#11151c;border:1px solid #654079;box-shadow:0 6px 18px #0004}.activityHero h3{margin:5px 0 0}</style></head>
<body><div class="wrap">
<header class="top"><div class="brand"><h1>Curso Pessoal de Inglês</h1><p>Sistema Léo · motor pedagógico e gerente da aprendizagem</p></div><span class="badge">memória local · sem API</span></header>
<nav class="nav"><button data-tab="home" class="active">Visão geral</button><button data-tab="lesson">Aula de hoje</button><button data-tab="memory">Memória</button><button data-tab="progress">Progresso</button><button data-tab="settings">Configurações</button></nav>
<main id="app"></main><div id="toast" class="toast"></div></div>
<script>
const KEY='sistema-leo-ingles-v1';
const fresh={version:1,profile:{name:'Léo',goal:'Desenvolver conversação, fluência, compreensão, escrita e autonomia em inglês.',level:'inicial em diagnóstico',interests:'educação, gestão escolar, viagens, cultura, trabalho e conversas do cotidiano',dailyMinutes:20,correction:'corrigir sem interromper a fluência; registrar erros relevantes e retomar depois'},state:{sessions:0,minutes:0,lastLesson:null,currentFocus:'diagnóstico e comunicação funcional',streak:0,skills:{compreensão:0,fluência:0,precisão:0,vocabulário:0,interação:0,escrita:0,pronúncia:0},errors:[],vocab:[],history:[],nextReview:[]},settings:{provider:'ChatGPT ou Gemini',language:'pt-BR',autoJson:true}};
let db=load(); let current=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(fresh)}catch(e){return structuredClone(fresh)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render();}
function esc(v=''){return String(v).replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]))}
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}
function pct(n){return Math.max(0,Math.min(100,Math.round(Number(n)||0)))}
function nav(tab){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab)); render(tab)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.tab));
function render(tab='home'){let el=document.querySelector('#app'); if(tab==='home')el.innerHTML=home(); if(tab==='lesson')el.innerHTML=lesson(); if(tab==='memory')el.innerHTML=memory(); if(tab==='progress')el.innerHTML=progress(); if(tab==='settings')el.innerHTML=settings(); bind(tab)}
function home(){let s=db.state,p=Object.values(s.skills),avg=p.length?Math.round(p.reduce((a,b)=>a+b,0)/p.length):0;return `<section class="grid"><div class="card span8"><h2>Pronto para estudar?</h2><p class="muted">O aplicativo escolhe o foco e monta uma aula completa a partir da sua memória. Você só executa a aula no ChatGPT ou Gemini e devolve o relatório.</p><div class="actions"><button onclick="startLesson()">Iniciar aula de hoje</button><button class="secondary" onclick="nav('memory')">Ver memória</button></div></div><div class="card span4"><span class="muted">progresso geral</span><div class="kpi">${avg}%</div><div class="progress"><i style="width:${avg}%"></i></div><p class="small muted">${s.sessions} sessões · ${s.minutes} min registrados</p></div><div class="card span4"><h3>Foco atual</h3><p>${esc(s.currentFocus)}</p></div><div class="card span4"><h3>Revisões pendentes</h3><div class="kpi">${s.nextReview.length}</div><p class="muted">erros e expressões a retomar</p></div><div class="card span4"><h3>Última sessão</h3><p>${s.lastLesson?esc(s.lastLesson):'Nenhuma sessão registrada.'}</p></div><div class="card span12"><h3>Biblioteca de experiências</h3><p class="muted">O motor alterna formatos para desenvolver competências diferentes e evitar aulas repetitivas.</p><div class="grid">${activities.map(a=>`<div class="card span4" style="padding:12px;background:#151922"><div class="row"><span style="font-size:23px">${a.icon}</span><b>${esc(a.name)}</b></div><p class="small muted">${esc(a.desc)}</p></div>`).join('')}</div></div><div class="card span12"><h3>Como o sistema funciona</h3><div class="step"><b>1 · Planejar</b><br>O app lê sua memória e define o objetivo, as etapas e os critérios da aula.</div><div class="step"><b>2 · Executar</b><br>Você copia um prompt completo para o ChatGPT ou Gemini e faz a aula por voz ou texto.</div><div class="step"><b>3 · Atualizar</b><br>Você cola o relatório final; o app interpreta o JSON e atualiza sua memória.</div></div></section>`}
function chooseFocus(){let s=db.state, skills=s.skills; if(s.sessions===0)return {title:'Diagnóstico funcional',skill:'fluência',reason:'observar seu ponto de partida sem transformar a primeira sessão em prova.'}; let keys=Object.keys(skills).sort((a,b)=>skills[a]-skills[b]); return {title:`Fortalecer ${keys[0]}`,skill:keys[0],reason:'prioridade definida pela habilidade com menor registro de desempenho.'}}
const activities=[
 {name:'Conversação guiada',icon:'💬',desc:'Perguntas graduadas e interação espontânea.',kind:'speaking'},
 {name:'História em quadrinhos',icon:'🖼️',desc:'Criar ou interpretar uma sequência visual em inglês.',kind:'comic'},
 {name:'Pesquisa na web',icon:'🔎',desc:'Investigar um tema real e explicar o que encontrou.',kind:'research'},
 {name:'Vídeo curto',icon:'🎬',desc:'Assistir a um vídeo curto e recuperar ideias principais.',kind:'video'},
 {name:'Simulação real',icon:'🎭',desc:'Resolver uma situação profissional ou cotidiana.',kind:'roleplay'},
 {name:'Escrita funcional',icon:'✍️',desc:'Produzir uma mensagem, relato ou opinião.',kind:'writing'},
 {name:'Ouvir e reconstruir',icon:'🎧',desc:'Compreender um áudio e reconstruir informações.',kind:'listening'}
];
function selectActivity(s){return activities[s.sessions%activities.length]}
function makeLesson(){let f=chooseFocus(), s=db.state, a=selectActivity(s); let prior=s.errors.slice(-4).map(x=>x.original+' → '+x.correction).join('; ')||'nenhum erro registrado';let vocab=s.vocab.slice(-5).map(x=>x.term).join(', ')||'nenhum item registrado';let task={speaking:'conduza uma conversa com perguntas progressivas e depois uma fala livre',comic:'crie uma história em quadrinhos de 4 a 6 quadros; eu devo interpretar, completar e recontar a história',research:'faça uma pesquisa breve na web sobre um tema relacionado aos meus interesses e peça que eu explique os achados em inglês',video:'se houver acesso à web, selecione um vídeo curto e acessível; peça compreensão, resumo e opinião',roleplay:'simule uma situação real com objetivo, restrições e informação que não deve ser revelada de imediato',writing:'proponha uma produção escrita funcional e depois peça uma versão revisada',listening:'apresente ou indique um áudio curto; peça ideia principal, detalhes e reconstrução oral'}[a.kind];return {id:Date.now(),focus:f,activity:a,title:f.title,objective:s.sessions===0?'Realizar uma amostra inicial de comunicação sobre sua vida, trabalho e interesses':`Usar inglês para realizar uma tarefa comunicativa relacionada a ${f.skill}`,task,steps:['Aquecimento e recuperação: responda perguntas curtas sem consultar tradução.','Input breve: receba um contexto visual, textual, sonoro ou audiovisual adequado ao nível.','Tarefa principal: '+task+'.','Feedback seletivo: receba apenas correções prioritárias.','Nova tentativa: refaça parte da tarefa usando as correções.','Fechamento: produza o relatório padronizado da sessão.'],prior,vocab}}
function promptFor(l){let p=db.profile;return `Você é meu professor de inglês dentro de uma sessão estruturada do Curso Pessoal de Inglês — Sistema Léo.\n\nPERFIL: Nome: ${p.name}. Objetivo: ${p.goal}. Interesses: ${p.interests}. Tempo: ${p.dailyMinutes} minutos. Nível atual registrado: ${p.level}.\n\nOBJETIVO DESTA AULA: ${l.objective}\nFOCO: ${l.focus.title}\nATIVIDADE CENTRAL: ${l.activity.icon} ${l.activity.name} — ${l.activity.desc}\nTAREFA: ${l.task}\nRAZÃO PEDAGÓGICA: ${l.focus.reason}\nERROS PRIORITÁRIOS A RETOMAR: ${l.prior}\nVOCABULÁRIO RECENTE: ${l.vocab}\n\nSEQUÊNCIA OBRIGATÓRIA:\n${l.steps.map((x,i)=>(i+1)+'. '+x).join('\n')}\n\nREGRAS: conduza uma etapa por vez; não despeje a aula inteira de uma vez; use inglês compatível com meu nível; em fluência não me interrompa por qualquer erro; registre erros relevantes; explique em português somente quando necessário; não use elogios artificiais; não invente evolução. Se a tarefa pedir web, vídeo ou imagem, use a ferramenta disponível; se não estiver disponível, crie uma alternativa textual equivalente. Ao final, entregue SOMENTE um relatório em JSON válido entre as marcas RELATORIO_INICIO e RELATORIO_FIM, seguido de uma síntese curta em português.\n\nFORMATO DO JSON:\n{\n "resumo":"", "minutos":20, "nivel_observado":"", "habilidades":{"compreensão":0,"fluência":0,"precisão":0,"vocabulário":0,"interação":0,"escrita":0,"pronúncia":0}, "pontos_fortes":[], "dificuldades":[], "erros":[{"original":"","correction":"","explanation":"","priority":"alta|média|baixa"}], "vocabulario":[{"term":"","meaning":"","example":"","mastery":0}], "proxima_revisao":[], "recomendacao":""\n}\nRELATORIO_INICIO\n[JSON]\nRELATORIO_FIM\n\nComece agora pela primeira etapa, sem explicar estas instruções.`}
function lesson(){if(!current)current=makeLesson();let l=current;return `<section class="grid"><div class="card span8"><div class="row" style="justify-content:space-between"><h2>Aula de hoje</h2><span class="badge">sessão ${db.state.sessions+1}</span></div><div class="activityHero"><div class="activityIcon">${l.activity.icon}</div><div><span class="pill">${esc(l.activity.name)}</span><h3>${esc(l.objective)}</h3><p class="muted">${esc(l.activity.desc)}</p></div></div><div class="lesson">${l.steps.map((x,i)=>`<div class="step"><b>${i+1}</b> · ${esc(x)}</div>`).join('')}</div><div class="actions"><button onclick="copyPrompt()">Copiar prompt da aula</button><button class="secondary" onclick="newLesson()">Recalcular aula</button></div><p class="small muted">Cole o prompt em uma conversa normal do ChatGPT ou Gemini e faça a sessão por voz ou texto.</p></div><div class="card span4"><h3>Contexto usado</h3><p><b>Erros:</b> ${esc(db.state.errors.slice(-3).map(x=>x.original).join(' · ')||'nenhum')}</p><p><b>Vocabulário:</b> ${esc(l.vocab||'nenhum')}</p><p><b>Foco:</b> ${esc(l.focus.reason)}</p><hr style="border-color:var(--line);border-width:1px 0 0"><h3>Por que esta atividade?</h3><p class="muted">${esc(l.activity.desc)} A escolha alterna formatos para evitar prática estreita e ampliar a transferência para situações reais.</p></div><div class="card span12"><h2>Registrar relatório da sessão</h2><p class="muted">Cole aqui o relatório final. O formato JSON é preferível, mas o sistema também salva um relatório textual como registro manual.</p><textarea id="report" placeholder="Cole aqui o relatório entre RELATORIO_INICIO e RELATORIO_FIM..."></textarea><div class="actions"><button class="green" onclick="importReport()">Atualizar memória</button><button class="secondary" onclick="saveTextReport()">Salvar como registro textual</button></div></div></section>`}
function memory(){let s=db.state;return `<section class="grid"><div class="card span6"><h2>Perfil</h2><p><b>Nome:</b> ${esc(db.profile.name)}</p><p><b>Objetivo:</b> ${esc(db.profile.goal)}</p><p><b>Interesses:</b> ${esc(db.profile.interests)}</p><p><b>Nível registrado:</b> ${esc(db.profile.level)}</p></div><div class="card span6"><h2>Foco e revisão</h2><p>${esc(s.currentFocus)}</p><p><b>Próximas revisões:</b> ${s.nextReview.length}</p><div class="actions"><button class="secondary" onclick="clearReviews()">Limpar revisões concluídas</button></div></div><div class="card span6"><h3>Erros recorrentes</h3>${s.errors.length?s.errors.slice().reverse().slice(0,12).map(x=>`<div class="step"><b>${esc(x.original)}</b><br><span class="ok">${esc(x.correction)}</span><br><span class="small muted">${esc(x.explanation||'')} · prioridade ${esc(x.priority||'')}</span></div>`).join(''):'<p class="muted">Ainda não há erros registrados.</p>'}</div><div class="card span6"><h3>Vocabulário recente</h3>${s.vocab.length?s.vocab.slice().reverse().slice(0,15).map(x=>`<div class="step"><b>${esc(x.term)}</b> — ${esc(x.meaning)}<br><span class="small muted">${esc(x.example||'')} · domínio ${pct(x.mastery)}%</span></div>`).join(''):'<p class="muted">Ainda não há vocabulário registrado.</p>'}</div></section>`}
function progress(){let sk=db.state.skills;return `<section class="grid"><div class="card span8"><h2>Desempenho por habilidade</h2>${Object.entries(sk).map(([k,v])=>`<div style="margin:13px 0"><div class="row" style="justify-content:space-between"><span>${esc(k)}</span><b>${pct(v)}%</b></div><div class="progress"><i style="width:${pct(v)}%"></i></div></div>`).join('')}</div><div class="card span4"><h2>Histórico</h2>${db.state.history.length?db.state.history.slice().reverse().slice(0,8).map(x=>`<div class="step"><b>${esc(x.date)}</b><br>${esc(x.summary||'Sessão registrada')}<br><span class="small muted">${esc(x.focus||'')}</span></div>`).join(''):'<p class="muted">Nenhuma sessão registrada.</p>'}</div><div class="card span12"><h2>Auditoria do progresso</h2><p class="muted">As pontuações são atualizadas apenas quando você importa um relatório. O sistema não cria evidência de aprendizagem sem uma sessão registrada.</p></div></section>`}
function settings(){return `<section class="grid"><div class="card span8"><h2>Configurações do estudante</h2><label>Nome</label><input id="name" value="${esc(db.profile.name)}"><label>Objetivo</label><textarea id="goal">${esc(db.profile.goal)}</textarea><label>Interesses e contextos</label><textarea id="interests">${esc(db.profile.interests)}</textarea><label>Nível registrado</label><input id="level" value="${esc(db.profile.level)}"><label>Tempo diário (minutos)</label><input id="minutes" type="number" min="5" max="120" value="${db.profile.dailyMinutes}"><div class="actions"><button onclick="saveSettings()">Salvar perfil</button></div></div><div class="card span4"><h2>Dados</h2><button class="secondary" onclick="downloadBackup()">Baixar backup</button><label>Restaurar backup JSON</label><input type="file" id="backup" accept=".json" onchange="restoreBackup(event)"><div class="actions"><button class="danger" onclick="resetAll()">Apagar todos os dados</button></div><p class="small muted">Faça backup antes de apagar ou trocar de dispositivo.</p></div></section>`}
function bind(tab){if(tab==='lesson'&&!current)current=makeLesson()}
function startLesson(){current=makeLesson();nav('lesson')}
function newLesson(){current=makeLesson();render('lesson');toast('Aula recalculada a partir da memória atual.')}
async function copyPrompt(){
  if(!current)current=makeLesson();
  const text=promptFor(current);
  let copied=false;
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);copied=true}}catch(e){}
  showPromptCopy(text,copied);
}
function showPromptCopy(text,copied){
  const old=document.getElementById('promptCopyModal');if(old)old.remove();
  const modal=document.createElement('div');modal.id='promptCopyModal';modal.className='modal-backdrop';
  modal.innerHTML=`<div class="modal card"><div class="row" style="justify-content:space-between"><h2>Prompt da aula</h2><button class="secondary" onclick="document.getElementById('promptCopyModal').remove()">Fechar</button></div><p class="muted">${copied?'O prompt foi copiado automaticamente.':'Não foi possível copiar automaticamente neste navegador. Toque no texto, selecione tudo e copie.'}</p><textarea id="promptCopyText" class="copy-area"></textarea><div class="actions"><button onclick="selectPromptText()">Selecionar texto</button><button class="green" onclick="copyPromptAgain()">Copiar para a área de transferência</button></div></div>`;
  document.body.appendChild(modal);document.getElementById('promptCopyText').value=text;
  if(copied)document.getElementById('promptCopyText').focus();
}
function selectPromptText(){const el=document.getElementById('promptCopyText');el.focus();el.select();toast('Texto selecionado. Toque em Copiar no menu do celular.')}
async function copyPromptAgain(){const el=document.getElementById('promptCopyText');try{await navigator.clipboard.writeText(el.value);toast('Prompt copiado. Cole no ChatGPT ou Gemini.')}catch(e){selectPromptText()}}
function extractJson(raw){let m=raw.match(/RELATORIO_INICIO\s*([\s\S]*?)\s*RELATORIO_FIM/i)||raw.match(/\{[\s\S]*\}/);if(!m)return null;let t=(m[1]||m[0]).trim();try{return JSON.parse(t)}catch(e){return null}}
function importReport(){let raw=document.querySelector('#report').value.trim();if(!raw)return toast('Cole um relatório primeiro.');let r=extractJson(raw);if(!r){toast('Não encontrei JSON válido. Use “Salvar como registro textual”.');return}let s=db.state;r.habilidades&&Object.entries(r.habilidades).forEach(([k,v])=>{if(k in s.skills&&Number.isFinite(Number(v)))s.skills[k]=Math.round((s.skills[k]*Math.min(s.sessions,4)+pct(v))/(Math.min(s.sessions,4)+1))});(r.erros||[]).forEach(x=>{if(x.original&&x.correction)s.errors.push({original:x.original,correction:x.correction,explanation:x.explanation||'',priority:x.priority||'média',date:new Date().toLocaleDateString('pt-BR')})});(r.vocabulario||[]).forEach(x=>{if(x.term)s.vocab.push({term:x.term,meaning:x.meaning||'',example:x.example||'',mastery:pct(x.mastery),date:new Date().toLocaleDateString('pt-BR')})});s.nextReview=[...s.nextReview,...(r.proxima_revisao||[])].slice(-50);s.sessions++;s.minutes+=Number(r.minutos)||db.profile.dailyMinutes;s.lastLesson=new Date().toLocaleDateString('pt-BR');s.currentFocus=r.recomendacao||current?.focus?.title||s.currentFocus;s.streak++;s.history.push({date:s.lastLesson,summary:r.resumo||'Sessão registrada',focus:current?.focus?.title||''});current=null;save();toast('Memória atualizada com sucesso.');nav('home')}
function saveTextReport(){let raw=document.querySelector('#report').value.trim();if(!raw)return toast('Cole um relatório primeiro.');db.state.sessions++;db.state.minutes+=db.profile.dailyMinutes;db.state.lastLesson=new Date().toLocaleDateString('pt-BR');db.state.history.push({date:db.state.lastLesson,summary:'Relatório textual salvo; pontuações não atualizadas.',focus:current?.focus?.title||''});current=null;save();toast('Registro salvo sem inventar pontuações.');nav('home')}
function saveSettings(){db.profile.name=document.querySelector('#name').value.trim()||'Léo';db.profile.goal=document.querySelector('#goal').value.trim();db.profile.interests=document.querySelector('#interests').value.trim();db.profile.level=document.querySelector('#level').value.trim();db.profile.dailyMinutes=Math.max(5,Math.min(120,Number(document.querySelector('#minutes').value)||20));save();toast('Perfil salvo.')}
function clearReviews(){db.state.nextReview=[];save();toast('Revisões pendentes removidas.')}
function downloadBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-sistema-leo-ingles.json';a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.profile||!x.state)throw Error();db=x;save();toast('Backup restaurado.')}catch(err){toast('Backup inválido.')}};r.readAsText(f)}
function resetAll(){if(confirm('Apagar toda a memória e o histórico? Esta ação só poderá ser revertida por backup.')){db=structuredClone(fresh);current=null;save();toast('Dados apagados.')}}

render();
